<svg xmlns="http://www.w3.org/2000/svg" width="240" height="280" viewBox="0 0 240 280">
<title>Kerege: solid wooden laths joined with leather</title>
<defs>
  <path id="lath" d="M0 0 C21.5 23.3 42 46.7 60 70 S99.5 116.7 120 140 S158.5 186.7 180 210 S219.5 256.7 240 280"/>
  <g id="wood" fill="none" stroke-linecap="round">
    <use href="#lath" transform="translate(2.5 3.5)" stroke="#20070a" stroke-width="22" opacity=".75"/>
    <use href="#lath" stroke="#653025" stroke-width="19"/>
    <use href="#lath" transform="translate(-.7 -.8)" stroke="#9e5940" stroke-width="15.5"/>
    <use href="#lath" transform="translate(-1.3 -1.2)" stroke="#ad6949" stroke-width="10" opacity=".7"/>
    <use href="#lath" transform="translate(-4.5 0)" stroke="#d29966" stroke-width=".8" opacity=".65"/>
    <path d="M-2 0 C24 31 41 49 52 66 S94 110 117 140 S153 177 168 196 S215 254 238 280" stroke="#713627" stroke-width=".85" opacity=".6"/>
    <path d="M2 0 C25 24 36 43 48 56 M66 77 C80 91 97 111 106 125 M128 148 C146 168 157 177 170 194 M187 216 C206 239 223 262 242 280" stroke="#e0a872" stroke-width=".7" opacity=".48"/>
    <path d="M52 58 Q68 67 73 85 Q57 76 52 58Z" stroke="#743a29" stroke-width=".8" opacity=".65"/>
    <path d="M59 65 Q65 69 66 76" stroke="#d8a16d" stroke-width=".65" opacity=".55"/>
  </g>
  <g id="joint">
    <ellipse cx="1" cy="2" rx="5.2" ry="4.8" fill="#28100d" opacity=".85"/>
    <path d="M-2.8-3.2Q.2-5.2 3.6-1.5L3.2 3.5Q.4 5.3-2.7 2.1Z" fill="#b59364" stroke="#4c281e" stroke-width="1.1"/>
    <path d="M-2.1-1.7 2.5 1.4M-1.5.4 1.7 3" fill="none" stroke="#dfc49c" stroke-width=".85" stroke-linecap="round"/>
    <path d="M1.5 3.2 1.2 6.4 3.1 7.3" fill="none" stroke="#93744f" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</defs>

<g id="rear" opacity=".88">
<use href="#wood" transform="translate(0 0) scale(-1 1)"/>
<use href="#wood" transform="translate(240 0) scale(-1 1)"/>
<use href="#wood" transform="translate(480 0) scale(-1 1)"/>
</g>
<g id="front">
<use href="#wood" transform="translate(-240 0)"/>
<use href="#wood" transform="translate(0 0)"/>
<use href="#wood" transform="translate(240 0)"/>
</g>
<use href="#joint" x="0" y="0"/>
<use href="#joint" x="240" y="0"/>
<use href="#joint" x="120" y="140"/>
<use href="#joint" x="0" y="280"/>
<use href="#joint" x="240" y="280"/>
</svg>
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://kenius.us/" />
    <meta name="description" content="Илсан Кенжебаев — контактная страница." />
    <meta name="theme-color" content="#f6f4ef" />
    <title>Илсан Кенжебаев — контакты</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: light;
        --paper: #f6f4ef;
        --ink: #272822;
        --muted: #66665e;
        --rule: #cecec3;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: clamp(24px, 7vw, 96px);
        background: var(--paper);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }
      main { width: min(100%, 740px); }
      h1 {
        margin: 0;
        max-width: 12ch;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(40px, 7.5vw, 80px);
        line-height: 1.08;
        font-weight: 400;
        letter-spacing: -0.035em;
      }
      .contact {
        margin-top: clamp(32px, 6vw, 52px);
        padding-top: 24px;
        border-top: 1px solid var(--rule);
      }
      .label {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 14px;
      }
      .phone {
        margin: 0;
        font-size: clamp(22px, 4vw, 28px);
        line-height: 1.4;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Илсан Кенжебаев</h1>
      <div class="contact">
        <p class="label">Телефон</p>
        <p class="phone">+996 123 123 123</p>
      </div>
    </main>
  </body>
</html>
